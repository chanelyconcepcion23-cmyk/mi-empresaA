<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inversiones Cruz - Sistema de Préstamos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    h2 { text-align: center; color: #4caf50; margin-top: 0; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #bbb; }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-main:hover { background: #1b5e20; }

    /* Ventana emergente del recibo */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 999;
    }

    /* Ticket Térmico Mejorado (Letra más grande y clara) */
    .receipt-card {
      background: #ffffff;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      width: 100%;
      max-width: 360px;
      padding: 22px 18px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.35;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .bold { font-weight: bold; }
    .divider { border-top: 1px dashed #000000; margin: 10px 0; }
    .client-title { font-size: 18px; font-weight: 800; margin: 8px 0; text-transform: uppercase; }
    .flex-row { display: flex; justify-content: space-between; margin: 5px 0; }

    /* Botones de la ventana */
    .btn-group { display: flex; gap: 8px; margin-top: 15px; }
    .btn-action {
      flex: 1; padding: 10px; border: none; border-radius: 5px;
      font-weight: bold; font-size: 13px; cursor: pointer; text-align: center;
    }
    .btn-print { background: #2e4a3e; color: #fff; }
    .btn-ws { background: #25d366; color: #fff; }
    .btn-close { background: #4a5568; color: #fff; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Inversiones Cruz</h2>
    
    <div class="form-group"><label>Nombre del Cliente:</label><input type="text" id="cliente" value="Ramon Pupen"></div>
    <div class="form-group"><label>Cobrado por:</label><input type="text" id="cobrador" value="EMMANUEL"></div>
    <div class="form-group"><label>Teléfono Cobrador:</label><input type="text" id="telCobrador" value="(829) 462-0598 / (849) 286-3988"></div>
    <div class="form-group"><label>Zona:</label><input type="text" id="zona" value="Bandera"></div>
    <div class="form-group"><label>Ticket No.:</label><input type="text" id="ticket" value="1787352496599941"></div>
    <div class="form-group"><label>Préstamo No.:</label><input type="text" id="prestamo" value="P599941"></div>
    <div class="form-group"><label>Cantidad Prestada (RD$):</label><input type="number" id="prestada" value="3000"></div>
    <div class="form-group"><label>Fecha Entrega (Ent):</label><input type="text" id="fEnt" value="14-jun-26"></div>
    <div class="form-group"><label>Fecha Término (Ter):</label><input type="text" id="fTer" value="13-sep-26"></div>
    <div class="form-group">
      <label>Desglose de Cuotas (ej: 10/13: $100, 11/13: $300):</label>
      <input type="text" id="cuotas" value="10/13: $100, 11/13: $300, 12/13: $300, 13/13: $300">
    </div>
    <div class="form-group"><label>Mora (RD$):</label><input type="number" id="mora" value="0"></div>
    <div class="form-group"><label>Balance Pendiente (RD$):</label><input type="number" id="balance" value="0"></div>

    <button class="btn-main" onclick="mostrarRecibo()">Generar Recibo</button>
  </div>

  <!-- Vista Previa del Recibo Imprimible -->
  <div class="overlay" id="modal">
    <div class="receipt-card">
      <div class="text-center">
        <div style="font-size: 20px; font-weight: 900;">RECIBO DE PAGO!</div>
        <div id="lblFechaLarga" style="font-size: 13px;"></div>
      </div>

      <div class="divider"></div>

      <div class="text-center">
        <strong style="font-size: 17px;">Inversiones Cruz</strong><br>
        Zona: <span id="lblZona"></span><br>
        Cobrado por: <span id="lblCobrador"></span><br>
        Tel: <span id="lblTel"></span>
      </div>

      <div class="divider"></div>

      <div class="text-right bold" id="lblFechaCorta"></div>

      <div class="client-title" id="lblCliente"></div>
      <div>Ticket . : <span id="lblTicket"></span></div>
      <div>Prestamo No. : <span id="lblPrestamo"></span></div>
      <div>Cantidad Prestada : RD$<span id="lblPrestada"></span></div>
      <div>Ent: <span id="lblEnt"></span> Ter: <span id="lblTer"></span></div>

      <div class="divider"></div>

      <div id="lblCuotas"></div>
      <div id="divMora" style="display:none;">Mora: RD$<span id="lblMora"></span></div>

      <div class="flex-row bold" style="font-size: 16px; margin-top: 8px;">
        <span>Total Monto Pagado:</span>
        <span>RD$<span id="lblTotal"></span></span>
      </div>

      <div class="divider"></div>

      <div class="flex-row bold" style="font-size: 19px;">
        <span>Balance:</span>
        <span>RD$<span id="lblBalance"></span></span>
      </div>

      <div class="divider"></div>

      <div class="text-center" style="font-size: 11px; font-weight: bold;">
        SIN RECIBO, NO HAY RECLAMOS!<br><br>
        En caso de incumplimiento, sus credito!datos seran procesados a data
      </div>

      <div class="btn-group">
        <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimir</button>
        <button class="btn-action btn-ws" onclick="enviarWhatsApp()">💬 WhatsApp</button>
      </div>
      <button class="btn-action btn-close" onclick="cerrar()">Cerrar</button>
    </div>
  </div>

  <script>
    function mostrarRecibo() {
      const ahora = new Date();
      document.getElementById('lblFechaLarga').innerText = ahora.toLocaleDateString('es-DO', {month:'long', year:'numeric'}) + ' - ' + ahora.toLocaleTimeString();
      document.getElementById('lblFechaCorta').innerText = 'Fecha: ' + ahora.getDate() + '-' + ahora.toLocaleString('es', {month:'short'}) + '-' + ahora.getFullYear().toString().slice(-2);

      document.getElementById('lblCliente').innerText = document.getElementById('cliente').value;
      document.getElementById('lblCobrador').innerText = document.getElementById('cobrador').value;
      document.getElementById('lblTel').innerText = document.getElementById('telCobrador').value;
      document.getElementById('lblZona').innerText = document.getElementById('zona').value;
      document.getElementById('lblTicket').innerText = document.getElementById('ticket').value;
      document.getElementById('lblPrestamo').innerText = document.getElementById('prestamo').value;
      document.getElementById('lblPrestada').innerText = Number(document.getElementById('prestada').value).toLocaleString();
      document.getElementById('lblEnt').innerText = document.getElementById('fEnt').value;
      document.getElementById('lblTer').innerText = document.getElementById('fTer').value;
      document.getElementById('lblBalance').innerText = Number(document.getElementById('balance').value).toLocaleString();

      // Procesa el desglose de cuotas
      const listaCuotas = document.getElementById('cuotas').value.split(',');
      let cuotasHTML = '';
      let suma = 0;

      listaCuotas.forEach(c => {
        if(c.trim() !== '') {
          cuotasHTML += `<div>Cuota Pagada ...${c.trim()}</div>`;
          const match = c.match(/\$(\d+)/);
          if(match) suma += parseInt(match[1]);
        }
      });

      const mora = parseInt(document.getElementById('mora').value) || 0;
      if(mora > 0) {
        document.getElementById('divMora').style.display = 'block';
        document.getElementById('lblMora').innerText = mora.toLocaleString();
        suma += mora;
      } else {
        document.getElementById('divMora').style.display = 'none';
      }

      document.getElementById('lblCuotas').innerHTML = cuotasHTML;
      document.getElementById('lblTotal').innerText = suma.toLocaleString();

      document.getElementById('modal').style.display = 'flex';
    }

    function cerrar() { document.getElementById('modal').style.display = 'none'; }

    function enviarWhatsApp() {
      const cliente = document.getElementById('cliente').value;
      const total = document.getElementById('lblTotal').innerText;
      const balance = document.getElementById('balance').value;
      const msg = `*Inversiones Cruz - Recibo de Pago*\nCliente: ${cliente}\nTotal Pagado: RD$${total}\nBalance Pendiente: RD$${balance}\n¡Gracias por su pago!`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }
  </script>
</body>
</html>
