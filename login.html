<body>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso - Sistema de Préstamos</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #173f8a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); width: 320px; text-align: center; }
    h2 { margin-top: 0; color: #173f8a; font-size: 22px; }
    .input-group { position: relative; margin: 10px 0; }
    input { width: 100%; padding: 10px 35px 10px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 14px; user-select: none; }
    button { width: 100%; padding: 12px; background: #173f8a; color: white; border: 0; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
    button:hover { background: #102d66; }
    .link { font-size: 13px; color: #173f8a; cursor: pointer; margin-top: 15px; display: inline-block; text-decoration: underline; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="box">
    <!-- FORMULARIO INICIAR SESIÓN -->
    <form id="fLogin">
      <h2>Iniciar Sesión</h2>
      <div class="input-group">
        <input id="user" placeholder="Usuario" required>
      </div>
      <div class="input-group">
        <input id="pass" type="password" placeholder="Contraseña" required>
        <span class="toggle-pass" onclick="togglePass('pass')">👁️</span>
      </div>
      <button type="submit">Entrar</button>
      <span class="link" onclick="toggleView()">¿No tienes cuenta? Crear usuario</span>
    </form>

    <!-- FORMULARIO REGISTRAR USUARIO -->
    <form id="fRegister" class="hidden">
      <h2>Registrar Usuario</h2>
      <div class="input-group">
        <input id="newUser" placeholder="Nombre de usuario" required>
      </div>
      <div class="input-group">
        <input id="newPass" type="password" placeholder="Contraseña" required>
        <span class="toggle-pass" onclick="togglePass('newPass')">👁️</span>
      </div>
      <button type="submit">Guardar Usuario</button>
      <span class="link" onclick="toggleView()">¿Ya tienes cuenta? Iniciar sesión</span>
    </form>
  </div>

  <script>
    const fLogin = document.getElementById('fLogin');
    const fRegister = document.getElementById('fRegister');

    // Cambiar entre Formulario de Login y Registro
    function toggleView() {
      fLogin.classList.toggle('hidden');
      fRegister.classList.toggle('hidden');
    }

    // Mostrar u Ocultar Contraseña
    function togglePass(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // REGISTRAR USUARIO NUEVO
    fRegister.onsubmit = (e) => {
      e.preventDefault();
      const u = document.getElementById('newUser').value.trim();
      const p = document.getElementById('newPass').value;

      let users = JSON.parse(localStorage.getItem('sistemaUsuarios')) || [];

      // Validar si el usuario ya existe
      if (users.some(item => item.u.toLowerCase() === u.toLowerCase())) {
        alert("El usuario '" + u + "' ya existe. Intenta con otro nombre.");
      } else {
        users.push({ u, p });
        localStorage.setItem('sistemaUsuarios', JSON.stringify(users));
        alert("¡Usuario '" + u + "' registrado con éxito! Ahora puedes iniciar sesión.");
        
        // Limpiar campos y volver al login
        document.getElementById('newUser').value = '';
        document.getElementById('newPass').value = '';
        toggleView();
      }
    };

    // INICIAR SESIÓN
    fLogin.onsubmit = (e) => {
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;

      let users = JSON.parse(localStorage.getItem('sistemaUsuarios')) || [];

      // Usuario maestro por defecto si aún no hay usuarios registrados
      if (users.length === 0 && u === "admin" && p === "1234") {
        window.location.href = "index.html";
        return;
      }

      // Buscar si el usuario y la contraseña coinciden
      const validUser = users.find(item => item.u.toLowerCase() === u.toLowerCase() && item.p === p);

      if (validUser) {
        window.location.href = "index.html";
      } else {
        alert("Usuario o contraseña incorrectos.");
      }
    };
  </script>
</body>
</html>
