<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - mi empresaA</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="theme-color" content="#0d5c3a">

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d5c3a;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    .header-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: #ffffff;
      padding: 4px;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin: 0 auto 15px auto;
      display: block;
    }
    h2 { margin: 0; color: #0d5c3a; font-size: 22px; }
    p.sub { color: #666; font-size: 13px; margin: 5px 0 20px 0; }

    .tab-group {
      display: flex;
      background-color: #e2e8f0;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 6px;
      color: #475569;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #0d5c3a;
      color: #ffffff;
    }

    .input-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
    input {
      width: 100%; 
      padding: 12px;
      border: 1px solid #cbd5e1; 
      border-radius: 8px;
      background-color: #f8fafc; 
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #0d5c3a; }
    .auth-box input { background-color: #f1f5f9; border-color: #94a3b8; }
    
    .btn-submit {
      width: 100%; 
      padding: 14px;
      background-color: #0d5c3a; 
      color: white;
      border: none; 
      border-radius: 8px;
      font-size: 16px; 
      font-weight: bold;
      cursor: pointer; 
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background-color: #084028; }

    .hidden { display: none !important; }

    .btn-download {
      display: none;
      width: 100%;
      padding: 10px;
      background-color: #25d366;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-download:hover { background-color: #1eb857; }
  </style>
</head>
<body>

  <div class="card">
    <button id="btnDownload" class="btn-download" onclick="instalarApp()">📥 Descargar / Instalar App</button>

    <img src="logo.svg" alt="Logo" class="header-logo">
    <h2>mi empresaA</h2>
    <p class="sub">Acceso Restringido al Sistema</p>

    <div class="tab-group">
      <button class="tab-btn active" id="tabLogin" onclick="cambiarModo('login')">Iniciar Sesión</button>
      <button class="tab-btn" id="tabRegister" onclick="cambiarModo('register')">Crear Usuario</button>
    </div>

    <form onsubmit="validarAcceso(event)">
      <div class="input-group auth-box hidden" id="boxAuthKey">
        <label>🔑 Clave de Autorización</label>
        <input type="password" id="authKey" placeholder="••••••••••••">
      </div>

      <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="regUser" placeholder="Usuario" required>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="regPass" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Iniciar Sesión / Entrar</button>
    </form>
  </div>

  <script>
    const CLAVE_CORRECTA = "chanely06112223"; 
    let modoActual = "login";

    function cambiarModo(modo) {
      modoActual = modo;
      const boxAuthKey = document.getElementById('boxAuthKey');
      const btnSubmit = document.getElementById('btnSubmit');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const authKeyInput = document.getElementById('authKey');

      if (modo === 'register') {
        boxAuthKey.classList.remove('hidden');
        authKeyInput.required = true;
        btnSubmit.innerText = "Registrar Nuevo Usuario";
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
      } else {
        boxAuthKey.classList.add('hidden');
        authKeyInput.required = false;
        authKeyInput.value = "";
        btnSubmit.innerText = "Iniciar Sesión / Entrar";
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      }
    }

    function validarAcceso(e) {
      e.preventDefault();
      
      if (modoActual === 'register') {
        const clave = document.getElementById('authKey').value;
        if (clave !== CLAVE_CORRECTA) {
          alert("❌ Clave de autorización incorrecta.");
          document.getElementById('authKey').value = "";
          return;
        }
        alert("✅ Usuario registrado exitosamente. Ahora puedes Iniciar Sesión.");
        cambiarModo('login');
      } else {
        sessionStorage.setItem("usuarioAutenticado", "true");
        window.location.href = "index.html";
      }
    }

    /* LÓGICA DE INSTALACIÓN PWA */
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btnDownload = document.getElementById('btnDownload');
      if (btnDownload) {
        btnDownload.style.display = 'block';
      }
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            const btnDownload = document.getElementById('btnDownload');
            if (btnDownload) {
              btnDownload.style.display = 'none';
            }
          }
          deferredPrompt = null;
        });
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

</body>
</html>
