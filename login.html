<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Restringido</title>
  <style>
    body {
      background-color: #122b1e;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #e2e8f0;
      padding: 30px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
    }
    .logo-circle {
      background-color: #1b4332;
      border: 2px dashed #d4af37;
      width: 65px; height: 65px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto 15px auto;
      color: #d4af37; font-size: 32px; font-weight: bold;
    }
    h2 { margin: 0; color: #1b4332; font-size: 22px; }
    p.sub { color: #555; font-size: 13px; margin: 5px 0 20px 0; }
    .input-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
    input {
      width: 100%; padding: 12px;
      border: 1px solid #cbd5e1; border-radius: 8px;
      background-color: #cbd5e1; font-size: 15px;
      box-sizing: border-box; outline: none;
    }
    .auth-box input { background-color: #b0c4de; border-color: #94a3b8; }
    .btn-submit {
      width: 100%; padding: 14px;
      background-color: #2d6a4f; color: white;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px;
    }
    .btn-submit:hover { background-color: #1b4332; }
    .link { display: block; margin-top: 15px; font-size: 13px; color: #2d6a4f; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-circle">P</div>
    <h2>Registro Restringido</h2>
    <p class="sub">Requiere clave de autorización</p>

    <form onsubmit="registrar(event)">
      <div class="input-group auth-box">
        <label>🔑 Clave de Autorización</label>
        <input type="password" id="authKey" placeholder="••••••••••••" required>
      </div>

      <div class="input-group">
        <label>Nuevo Usuario</label>
        <input type="text" id="regUser" placeholder="ej: emma21" required>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="regPass" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Crear Cuenta Autorizada</button>
    </form>

    <a href="#" class="link" onclick="alert('Redirigiendo a inicio de sesión')">¿Ya tienes cuenta? Iniciar Sesión</a>
  </div>

  <script>
    function registrar(e) {
      e.preventDefault();
      const clave = document.getElementById('authKey').value;
      const usr = document.getElementById('regUser').value;

      if (clave !== "123456") {
        alert("❌ Clave de autorización incorrecta.");
        return;
      }

      alert("✅ Usuario " + usr + " creado exitosamente.");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
